<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Maker & PDF Merger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
  header { background: #2c3e50; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 1.4rem; }
  nav { display: flex; gap: 8px; padding: 12px 24px; background: #fff; border-bottom: 1px solid #ddd; }
  nav button { padding: 8px 16px; border: 1px solid #2c3e50; background: #fff; cursor: pointer; border-radius: 4px; }
  nav button.active { background: #2c3e50; color: #fff; }
  main { padding: 24px; max-width: 1000px; margin: auto; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input, textarea { width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 4px; font: inherit; }
  textarea { min-height: 80px; resize: vertical; }
  .btn { padding: 10px 18px; background: #2c3e50; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-top: 12px; }
  .btn-small { padding: 4px 8px; background: #eee; border: 1px solid #bbb; border-radius: 4px; cursor: pointer; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .hint { color: #666; font-size: 0.85rem; margin: 4px 0 0; }
  #cv-preview { background: #fff; padding: 40px; margin-top: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.15); min-height: 300px; }
  #cv-preview h1 { margin: 0; font-size: 1.8rem; }
  #cv-preview h3 { border-bottom: 1px solid #ccc; padding-bottom: 2px; margin: 18px 0 6px; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 0.05em; }
  #cv-preview ul { margin: 0; padding-left: 20px; }
  .role { font-size: 1.1rem; color: #555; margin: 4px 0; }
  .contact { color: #555; font-size: 0.9rem; margin: 0; }
  #fileList { padding-left: 0; list-style: none; }
  #fileList li { display: flex; align-items: center; gap: 6px; padding: 8px; background: #fff; border: 1px solid #ddd; margin-bottom: 6px; border-radius: 4px; }
  #fileList li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { margin-top: 12px; font-weight: 600; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } #cv-preview { padding: 20px; } }

  @media print {
    body * { visibility: hidden; }
    #cv-preview, #cv-preview * { visibility: visible; }
    #cv-preview { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 20px; box-shadow: none; }
    header, nav, .no-print { display: none !important; }
  }
</style>
</head>
<body>
<header><h1>CV Maker & PDF Merger</h1></header>
<nav class="no-print">
  <button data-tab="cv-tab" class="active">Make CV</button>
  <button data-tab="merge-tab">Merge PDFs</button>
</nav>

<main>
  <!-- CV TAB -->
  <section id="cv-tab">
    <form id="cv-form" class="no-print" onsubmit="return false">
      <div class="grid">
        <div><label for="name">Full name</label><input id="name"></div>
        <div><label for="title">Job title</label><input id="title"></div>
        <div><label for="email">Email</label><input id="email" type="email"></div>
        <div><label for="phone">Phone</label><input id="phone"></div>
        <div><label for="location">Location</label><input id="location"></div>
      </div>
      <label for="summary">Summary</label>
      <textarea id="summary" placeholder="2–4 sentences about you"></textarea>
      <label for="experience">Experience</label>
      <textarea id="experience" placeholder="One entry per line, e.g.&#10;Cashier, Corner Shop (2021–2023): handled cash and stock"></textarea>
      <label for="education">Education</label>
      <textarea id="education" placeholder="One entry per line"></textarea>
      <label for="skills">Skills</label>
      <input id="skills" placeholder="Comma-separated, e.g. Excel, Customer service, Spanish">
      <p class="hint">Print tip: in the print dialog, untick "Headers and footers" and choose "Save as PDF".</p>
      <button type="button" class="btn" id="printBtn">Print / Save as PDF</button>
    </form>
    <div id="cv-preview"></div>
  </section>

  <!-- MERGE TAB -->
  <section id="merge-tab" hidden>
    <label for="pdfInput">Add PDF files</label>
    <input type="file" id="pdfInput" accept="application/pdf" multiple>
    <p class="hint">Use the arrows to set the order. Files are merged in the order shown.</p>
    <ol id="fileList"></ol>
    <button class="btn" id="mergeBtn">Merge and download</button>
    <p id="status"></p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lines = t => t.split('\n').map(x => x.trim()).filter(Boolean);

// ---------- Tabs ----------
document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== btn.dataset.tab);
  };
});

// ---------- CV ----------
function section(title, body) {
  return body ? `<h3>${title}</h3>${body}` : '';
}
function bulletList(text) {
  const items = lines(text);
  return items.length ? `<ul>${items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
}
function renderCV() {
  const v = id => $(id).value.trim();
  const contact = [v('email'), v('phone'), v('location')].filter(Boolean).map(esc).join(' · ');
  const skills = v('skills').split(',').map(s => s.trim()).filter(Boolean);
  $('cv-preview').innerHTML = `
    <h1>${v('name') ? esc(v('name')) : 'Your Name'}</h1>
    ${v('title') ? `<p class="role">${esc(v('title'))}</p>` : ''}
    ${contact ? `<p class="contact">${contact}</p>` : ''}
    ${section('Summary', v('summary') ? `<p>${esc(v('summary'))}</p>` : '')}
    ${section('Experience', bulletList(v('experience')))}
    ${section('Education', bulletList(v('education')))}
    ${section('Skills', skills.length ? `<p>${skills.map(esc).join(', ')}</p>` : '')}
  `;
}
document.querySelectorAll('#cv-form input, #cv-form textarea').forEach(el =>
  el.addEventListener('input', renderCV));
$('printBtn').onclick = () => { renderCV(); window.print(); };
renderCV();

// ---------- PDF merge ----------
let files = [];

function renderList() {
  $('fileList').innerHTML = files.map((f, i) => `
    <li>
      <span>${esc(f.name)}</span>
      <button class="btn-small" data-act="up" data-i="${i}">↑</button>
      <button class="btn-small" data-act="down" data-i="${i}">↓</button>
      <button class="btn-small" data-act="del" data-i="${i}">✕</button>
    </li>`).join('');
}
function setStatus(msg) { $('status').textContent = msg; }

$('pdfInput').onchange = e => {
  files.push(...e.target.files);
  e.target.value = '';
  renderList();
  setStatus('');
};

$('fileList').onclick = e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const i = Number(btn.dataset.i);
  const act = btn.dataset.act;
  if (act === 'del') files.splice(i, 1);
  if (act === 'up' && i > 0) [files[i - 1], files[i]] = [files[i], files[i - 1]];
  if (act === 'down' && i < files.length - 1) [files[i + 1], files[i]] = [files[i], files[i + 1]];
  renderList();
};

$('mergeBtn').onclick = async () => {
  if (files.length < 2) { setStatus('Add at least two PDF files.'); return; }
  if (!window.PDFLib) { setStatus('Could not load the PDF library. Check your internet connection.'); return; }
  setStatus('Merging…');
  try {
    const { PDFDocument } = PDFLib;
    const out = await PDFDocument.create();
    for (const f of files) {
      let src;
      try {
        src = await PDFDocument.load(await f.arrayBuffer());
      } catch {
        throw new Error(`Could not read "${f.name}". It may be password-protected or damaged.`);
      }
      const pages = await out.copyPages(src, src.getPageIndices());
      pages.forEach(p => out.addPage(p));
    }
    const bytes = await out.save();
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'merged.pdf';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus(`Done: ${out.getPageCount()} pages merged.`);
  } catch (err) {
    setStatus(err.message);
  }
};
</script>
</body>
</html>
